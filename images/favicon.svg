<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Charcoal Teal -->
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A36"/>
      <stop offset="50%" stop-color="#0A1D26"/>
      <stop offset="100%" stop-color="#05181E"/>
    </linearGradient>

    <!-- Circuit Gradients -->
    <linearGradient id="favBOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#E8A838"/>
      <stop offset="75%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#00A896"/>
    </linearGradient>

    <!-- Glowing Blooms -->
    <radialGradient id="favCenterBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1"/>
      <stop offset="20%" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F5A623" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="favCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="30%" stop-color="#2DD4BF" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#00A896" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00A896" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="favAmberGlowUpper" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F5A623" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Ground Reflection Under Icon Mark -->
    <radialGradient id="favGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A896" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0D6E6E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0E2A36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Modern Rounded App Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#favBgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>
  <ellipse cx="256" cy="430" rx="150" ry="24" fill="url(#favGroundShadow)"/>

  <!-- Balaji AI Neural B Icon Mark Scaled and Centered -->
  <g id="fav-icon-mark" transform="translate(256, 256) scale(1.68) translate(-147, -118.5)">
    <!-- Light Blooms Behind Circuit Lines -->
    <circle cx="187" cy="118.5" r="32" fill="url(#favCenterBloom)"/>
    <ellipse cx="206" cy="186" rx="42" ry="14" fill="url(#favCyanGlow)"/>
    <circle cx="230" cy="85" r="30" fill="url(#favAmberGlowUpper)"/>

    <!-- Neural Network Chords -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Outer Hexagonal Facets -->
      <line x1="46" y1="118.5" x2="67" y2="78" stroke="#00A896" stroke-width="3" opacity="0.85"/>
      <line x1="46" y1="118.5" x2="66" y2="158" stroke="#00A896" stroke-width="3" opacity="0.85"/>
      <line x1="67" y1="78" x2="121.5" y2="51" stroke="#14B8A6" stroke-width="3" opacity="0.85"/>
      <line x1="66" y1="158" x2="121.5" y2="186" stroke="#0D9488" stroke-width="3" opacity="0.85"/>

      <!-- Diamond Struts to Center Waist Node (187, 118.5) -->
      <line x1="121.5" y1="51" x2="187" y2="118.5" stroke="#F5A623" stroke-width="3.6" opacity="0.95"/>
      <line x1="121.5" y1="186" x2="187" y2="118.5" stroke="#14B8A6" stroke-width="3.6" opacity="0.92"/>
      <line x1="163" y1="56" x2="187" y2="118.5" stroke="#F5A623" stroke-width="3.8" opacity="0.98"/>
      <line x1="164" y1="186" x2="187" y2="118.5" stroke="#00A896" stroke-width="3.6" opacity="0.92"/>

      <!-- Center Horizontal Flare Line -->
      <line x1="131" y1="118.5" x2="187" y2="118.5" stroke="#FDE68A" stroke-width="4.5"/>
      <line x1="187" y1="118.5" x2="204" y2="118.5" stroke="#F5A623" stroke-width="5"/>

      <!-- Internal Triangulation Chords -->
      <line x1="46" y1="118.5" x2="91.5" y2="118.5" stroke="#00A896" stroke-width="3" opacity="0.9"/>
      <line x1="67" y1="78" x2="91.5" y2="118.5" stroke="#00A896" stroke-width="3" opacity="0.9"/>
      <line x1="66" y1="158" x2="91.5" y2="118.5" stroke="#00A896" stroke-width="3" opacity="0.9"/>
      <line x1="67" y1="78" x2="131" y2="95" stroke="#0D9488" stroke-width="2.8" opacity="0.85"/>
      <line x1="66" y1="158" x2="131" y2="142" stroke="#0D9488" stroke-width="2.8" opacity="0.85"/>

      <line x1="91.5" y1="118.5" x2="121.5" y2="51" stroke="#0D9488" stroke-width="3" opacity="0.9"/>
      <line x1="91.5" y1="118.5" x2="121.5" y2="186" stroke="#0D9488" stroke-width="3" opacity="0.9"/>
      <line x1="91.5" y1="118.5" x2="131" y2="95" stroke="#14B8A6" stroke-width="3" opacity="0.9"/>
      <line x1="91.5" y1="118.5" x2="131" y2="142" stroke="#14B8A6" stroke-width="3" opacity="0.9"/>
      <line x1="91.5" y1="118.5" x2="131" y2="118.5" stroke="#F5A623" stroke-width="3.2" opacity="0.95"/>

      <!-- Vertical Node Spine -->
      <line x1="121.5" y1="51" x2="131" y2="95" stroke="#F5A623" stroke-width="3.6" opacity="0.95"/>
      <line x1="131" y1="95" x2="131" y2="142" stroke="#F5A623" stroke-width="3.6" opacity="0.95"/>
      <line x1="131" y1="142" x2="121.5" y2="186" stroke="#14B8A6" stroke-width="3.6" opacity="0.95"/>
    </g>

    <!-- Outer 'B' Circuit Loop -->
    <path d="M 163 56 L 210 56 C 236 56, 252 70, 252 87 C 252 104, 236 118.5, 210 118.5 L 198 118.5 L 210 118.5 C 238 118.5, 253 134, 253 152 C 253 170, 236 186, 208 186 L 164 186" 
          stroke="url(#favBOuterGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Inner 'B' Circuit Loops -->
    <path d="M 176 74 L 210 74 C 224 74, 232 80, 232 88 C 232 96, 224 103, 210 103 L 192 103" 
          stroke="#00A896" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

    <path d="M 176 168 L 210 168 C 224 168, 232 161, 232 153 C 232 144, 224 137, 210 137 L 192 137" 
          stroke="#00A896" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

    <!-- Circular Specular Nodes -->
    <!-- Teal Nodes -->
    <circle cx="46" cy="118.5" r="9.5" fill="#00A896" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <circle cx="43.5" cy="115.5" r="3" fill="#5EEAD4" opacity="0.85"/>

    <circle cx="67" cy="78" r="9.5" fill="#00A896" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <circle cx="64.5" cy="75" r="3" fill="#5EEAD4" opacity="0.85"/>

    <circle cx="66" cy="158" r="9.5" fill="#00A896" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <circle cx="63.5" cy="155" r="3" fill="#5EEAD4" opacity="0.85"/>

    <circle cx="91.5" cy="118.5" r="11" fill="#00A896" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <circle cx="88.5" cy="115" r="3.5" fill="#5EEAD4" opacity="0.9"/>

    <circle cx="164" cy="186" r="10" fill="#00A896" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <circle cx="161.5" cy="183" r="3" fill="#5EEAD4" opacity="0.85"/>

    <circle cx="121.5" cy="186" r="10.5" fill="#14B8A6" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <circle cx="118.5" cy="182.5" r="3.2" fill="#5EEAD4" opacity="0.9"/>

    <!-- Amber Nodes -->
    <circle cx="121.5" cy="51" r="10.5" fill="#F5A623" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <circle cx="118.5" cy="47.5" r="3.2" fill="#FEF08A" opacity="0.95"/>

    <circle cx="131" cy="95" r="10" fill="#F5A623" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <circle cx="128" cy="92" r="3" fill="#FEF08A" opacity="0.95"/>

    <circle cx="131" cy="142" r="10" fill="#F5A623" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <circle cx="128" cy="139" r="3" fill="#FEF08A" opacity="0.95"/>

    <circle cx="163" cy="56" r="10" fill="#F5A623" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <circle cx="160" cy="53" r="3" fill="#FEF08A" opacity="0.95"/>

    <!-- Central Waist Node (Bright Star Apex) -->
    <circle cx="187" cy="118.5" r="11" fill="#F5A623" stroke="rgba(255,255,255,0.6)" stroke-width="1.8"/>
    <circle cx="187" cy="118.5" r="5.5" fill="#FFFBEB"/>
  </g>
</svg>
